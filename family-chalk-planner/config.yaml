# Family Chalk Planner as a Home Assistant app.
#
# Nothing is built here: Home Assistant pulls the same image every Docker install uses,
# ghcr.io/joshua-d-miller/family-chalk-planner, at the tag in "version" below. That number is kept in
# step with the board's newest release by .github/workflows/follow-releases.yaml, so a new release
# shows up as "Update" in Settings → Apps.
name: Family Chalk Planner
version: "1.1.1"
slug: family_chalk_planner
description: A chalkboard-style family wall calendar for a wall screen, edited from a tablet
url: https://github.com/joshua-d-miller/family-chalk-planner
arch:
  - amd64
  - aarch64
image: ghcr.io/joshua-d-miller/family-chalk-planner
startup: application
boot: auto
# In Home Assistant's sidebar (Ingress): its people sign in with their Home Assistant login; its
# admins are the board's admins. The board reads Home Assistant's calendars and to-do lists.
ingress: true
ingress_port: 3002
panel_icon: mdi:calendar-heart
panel_title: Family Board
homeassistant_api: true
# its own port, for a wall screen with nothing of Home Assistant around it: open
# http://<home assistant>:3002/ there and pair it from the board's admin console
ports:
  3002/tcp: 3002
watchdog: http://[HOST]:[PORT:3002]/api/health
# Configuration tab: one switch, to remove every paired screen and board account (see DOCS.md)
options:
  reset_admin: false
schema:
  reset_admin: bool
environment:
  # the board's Updates section says Home Assistant updates it (no update.sh here)
  UPDATER: homeassistant
# Everything the board keeps is in the app's /data folder, so Home Assistant's backups include it:
# the database, the settings key, uploads and the nightly copies. The caches rebuild themselves.
backup_exclude:
  - "*clipart-cache*"
  - "*photo-cache*"
